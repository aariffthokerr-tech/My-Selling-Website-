<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novatek Tech Store - High-End Electronics</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#07120a; color:#f0fdf4; padding:20px; min-height:100vh; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .brand { font-size:22px; font-weight:800; color:#bef264; letter-spacing:1px; }
    .nav-tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:20px; }
    .tab { padding:6px 14px; background:#0c1d12; border:1px solid #1a3824; border-radius:20px; color:#9ca3af; font-size:13px; cursor:pointer; }
    .tab.active { background:#bef264; color:#041007; font-weight:700; border-color:#bef264; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; }
    .item { background:#0a1910; border:1px solid #163321; border-radius:14px; padding:16px; transition:0.2s; }
    .item:hover { border-color:#bef264; }
    .icon { font-size:40px; margin-bottom:12px; }
    .item h3 { font-size:16px; margin-bottom:6px; }
    .specs { font-size:12px; color:#86efac; margin-bottom:12px; }
    .row { display:flex; justify-content:space-between; align-items:center; }
    .price { font-size:16px; font-weight:800; color:#bef264; }
    .btn { background:#142d1e; border:1px solid #235235; color:#bef264; padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; font-weight:600; }
    .btn:hover { background:#bef264; color:#061309; }
  </style>
</head>
<body>
  <header>
    <div class="brand">NOVATEK ELECTRONICS</div>
    <div style="font-size:13px; color:#86efac;">⚡ 24h Express Dispatch</div>
  </header>
  <div class="nav-tabs">
    <div class="tab active" onclick="filterItems('all', this)">All Hardware</div>
    <div class="tab" onclick="filterItems('audio', this)">Audio</div>
    <div class="tab" onclick="filterItems('wearable', this)">Wearables</div>
    <div class="tab" onclick="filterItems('power', this)">Power</div>
  </div>
  <div class="grid" id="grid">
    <div class="item" data-cat="audio">
      <div class="icon">🎧</div>
      <h3>Spatial Sound X-900</h3>
      <div class="specs">Active ANC · 40h Battery · LDAC</div>
      <div class="row">
        <span class="price">Rs 18,990</span>
        <button class="btn" onclick="alert('Added Spatial Sound X-900 to cart')">Select Item</button>
      </div>
    </div>
    <div class="item" data-cat="wearable">
      <div class="icon">⌚</div>
      <h3>ChronoTitan Watch V2</h3>
      <div class="specs">Titanium Frame · Sapphire Glass · GPS</div>
      <div class="row">
        <span class="price">Rs 24,500</span>
        <button class="btn" onclick="alert('Added ChronoTitan Watch V2 to cart')">Select Item</button>
      </div>
    </div>
    <div class="item" data-cat="power">
      <div class="icon">⚡</div>
      <h3>GaN Fast Station 140W</h3>
      <div class="specs">4x USB-C · Power Delivery 3.1</div>
      <div class="row">
        <span class="price">Rs 8,200</span>
        <button class="btn" onclick="alert('Added GaN Fast Station 140W to cart')">Select Item</button>
      </div>
    </div>
  </div>
  <script>
    function filterItems(cat, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('.item').forEach(item => {
        if (cat === 'all' || item.dataset.cat === cat) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
