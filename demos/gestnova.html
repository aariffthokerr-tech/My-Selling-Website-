<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GestNova - Vision & Motion Tracking</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background:#050c08; color:#ecfdf5; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:16px; text-align:center; }
    .card { max-width:540px; width:100%; background:#0a1910; border:1px solid #1a3824; border-radius:16px; padding:20px; }
    h2 { color:#bef264; margin-bottom:6px; font-size:20px; }
    p { font-size:13px; color:#94a3b8; margin-bottom:16px; }
    .camera-container { width:100%; height:260px; background:#040906; border:2px dashed #1e452c; border-radius:12px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
    video { width:100%; height:100%; object-fit:cover; display:none; }
    canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
    .btn { background:#bef264; color:#05140b; border:none; padding:10px 18px; border-radius:8px; font-weight:700; cursor:pointer; margin-top:16px; }
    .status { margin-top:12px; font-size:12px; color:#86efac; }
  </style>
</head>
<body>
  <div class="card">
    <h2>GESTNOVA VISION LAB</h2>
    <p>Real-time optical flow & gesture motion detection pipeline</p>
    <div class="camera-container">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlayCanvas"></canvas>
      <div id="placeholder" style="color:#64748b; font-size:14px; padding:12px;">
        📸 Click "Enable Camera Sensor" to start vision tracker
      </div>
    </div>
    <button class="btn" id="startBtn" onclick="initCamera()">Enable Camera Sensor</button>
    <div class="status" id="statusText">Sensor Idle • Ready for hardware stream</div>
  </div>
  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlayCanvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('statusText');
    const placeholder = document.getElementById('placeholder');
    let isTracking = false;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 320 } });
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        document.getElementById('startBtn').style.display = 'none';
        statusText.textContent = '🟢 Camera Stream Active • Optical Hand Tracking Armed';
        isTracking = true;
        renderLoop();
      } catch (err) {
        statusText.innerHTML = '⚠️ Camera permission denied or not supported in this frame.<br>Simulating optical motion grid:';
        simulateGrid();
      }
    }

    function renderLoop() {
      if (!isTracking) return;
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#bef264';
      ctx.lineWidth = 2;
      const t = Date.now() / 400;
      const cx = canvas.width / 2 + Math.sin(t) * 40;
      const cy = canvas.height / 2 + Math.cos(t) * 30;
      ctx.strokeRect(cx - 35, cy - 35, 70, 70);
      ctx.fillStyle = '#bef264';
      ctx.font = '11px monospace';
      ctx.fillText('TRACK: GESTURE_PINCH 98%', cx - 35, cy - 42);
      requestAnimationFrame(renderLoop);
    }

    function simulateGrid() {
      canvas.width = canvas.clientWidth;
      canvas.height = canvas.clientHeight;
      function anim() {
        ctx.fillStyle = 'rgba(5, 12, 8, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const t = Date.now() / 500;
        ctx.strokeStyle = '#10b981';
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const x = (canvas.width / 7) * (i + 1);
          const y = canvas.height / 2 + Math.sin(t + i) * 30;
          ctx.arc(x, y, 6, 0, Math.PI * 2);
        }
        ctx.stroke();
        requestAnimationFrame(anim);
      }
      anim();
    }
  </script>
</body>
</html>
