<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazario - Modern Marketplace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #07100b; color: #f0fdf4; min-height: 100vh; padding: 16px; }
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #14281c; }
    .logo { font-size: 20px; font-weight: 800; color: #bef264; letter-spacing: -0.5px; }
    .badge { background: #12281a; border: 1px solid #234830; color: #86efac; padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    .hero-banner { background: linear-gradient(135deg, #0e2718, #07150d); border: 1px solid #1b3d27; border-radius: 16px; padding: 20px; margin: 16px 0; }
    .hero-banner h1 { font-size: 18px; margin-bottom: 6px; }
    .hero-banner p { font-size: 13px; color: #9ca3af; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .card { background: #0b1a11; border: 1px solid #183322; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
    .img-box { height: 90px; background: #102418; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 8px; }
    .card h3 { font-size: 14px; margin-bottom: 4px; }
    .card .price { font-size: 14px; font-weight: 700; color: #bef264; margin-bottom: 8px; }
    .btn { background: #bef264; color: #05140b; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #a3e635; }
    .cart-bar { position: sticky; bottom: 0; background: #09180f; border: 1px solid #1e3f2b; padding: 12px 16px; border-radius: 12px; margin-top: 16px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">BAZARIO APP</div>
    <div class="badge" id="cartCount">Cart: 0 items</div>
  </div>
  <div class="hero-banner">
    <h1>Weekend Gadget Flash Sale</h1>
    <p>Direct merchant pricing with verified WhatsApp checkout</p>
    <button class="btn" onclick="addItem('Pro Earbuds', 2499)">Shop Featured Offer</button>
  </div>
  <div class="grid">
    <div class="card">
      <div class="img-box">🎧</div>
      <h3>Studio Buds ANC</h3>
      <div class="price">Rs 4,999</div>
      <button class="btn" onclick="addItem('Studio Buds ANC', 4999)">+ Add to Cart</button>
    </div>
    <div class="card">
      <div class="img-box">⌚</div>
      <h3>Apex Watch Gen 4</h3>
      <div class="price">Rs 7,499</div>
      <button class="btn" onclick="addItem('Apex Watch Gen 4', 7499)">+ Add to Cart</button>
    </div>
    <div class="card">
      <div class="img-box">🔋</div>
      <h3>Turbo MagPower 65W</h3>
      <div class="price">Rs 2,199</div>
      <button class="btn" onclick="addItem('Turbo MagPower 65W', 2199)">+ Add to Cart</button>
    </div>
    <div class="card">
      <div class="img-box">🎮</div>
      <h3>HyperDrive Gamepad</h3>
      <div class="price">Rs 3,899</div>
      <button class="btn" onclick="addItem('HyperDrive Gamepad', 3899)">+ Add to Cart</button>
    </div>
  </div>
  <div class="cart-bar">
    <div>
      <span style="font-size:12px; color:#9ca3af;">Total Order:</span>
      <strong id="cartTotal" style="color:#bef264; font-size:16px; display:block;">Rs 0</strong>
    </div>
    <button class="btn" onclick="checkout()">Proceed to WhatsApp →</button>
  </div>
  <script>
    let count = 0;
    let total = 0;
    function addItem(name, price) {
      count++;
      total += price;
      document.getElementById('cartCount').textContent = 'Cart: ' + count + ' items';
      document.getElementById('cartTotal').textContent = 'Rs ' + total.toLocaleString();
    }
    function checkout() {
      if (count === 0) {
        alert('Your cart is empty! Add an item first.');
        return;
      }
      alert('Order simulated successfully for ' + count + ' items (Rs ' + total.toLocaleString() + ')!');
    }
  </script>
</body>
</html>
